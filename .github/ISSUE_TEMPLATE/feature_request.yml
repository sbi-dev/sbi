name: Feature request
description: Suggest an improvement or a new feature for sbi
labels: ["feature request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >-
        Describe the limitation you run into. If the request is not related to a
        problem, tell us what you want to do instead.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should sbi do? An API sketch helps a lot.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve this, and why you prefer the one above.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: References, papers, or related issues.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: >-
        If you want to implement this, please also tell us how you would test it.
        Our contributing guide explains how a proposal claims an issue.
      options:
        - label: I would like to work on this myself.
          required: false
